<!DOCTYPE html>
<html>
<head>
    <title>Fresh Milk BMC Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- HEADER -->
        <header>
            <h1>🥛 Fresh Milk BMC Dashboard</h1>
            <div class="stats">
                <span id="lastUpdate">Last sync: --</span>
            </div>
        </header>

        <!-- INVENTORY -->
        <section class="inventory">
            <h2>📦 Current Inventory</h2>
            <div class="milk-cards">
                <div class="milk-card urgent">
                    <h3>30L</h3>
                    <span>0 days spoilage</span>
                </div>
                <div class="milk-card warning">
                    <h3 id="milk1day">10L</h3>
                    <span>1 day spoilage</span>
                </div>
                <div class="milk-card normal">
                    <h3 id="milk2days">5L</h3>
                    <span>2 days spoilage</span>
                </div>
            </div>
        </section>

        <!-- VENDORS LIST (Auto-refreshes) -->
        <section class="vendors">
            <h2>🛒 New Vendor Requests</h2>
            <div id="vendorsList">Refreshing...</div>
            <button onclick="refreshData()">🔄 Refresh Vendors</button>
        </section>

        <!-- AI CHAT -->
        <section class="ai-chat">
            <h2>🤖 AI Vendor Advisor</h2>
            <div id="aiResponse" class="ai-output"></div>
            <div class="chat-input">
                <input type="text" id="aiQuery" placeholder="Ask AI: Which vendor should I pick?">
                <button onclick="askAI()">Ask AI</button>
            </div>
        </section>

        <!-- TRIGGER DISRUPTION (Hackathon Demo) -->
        <section class="demo">
            <button class="disrupt-btn" onclick="triggerDisruption()">🚨 Simulate Yield Drop</button>
        </section>
    </div>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
