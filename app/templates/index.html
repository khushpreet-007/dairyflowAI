<!DOCTYPE html>
<html>
<head>
    <title>Fresh Milk BMC Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .vendor-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
        }
        .btn-accept {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-accept:hover { background-color: #15803d; }
        .btn-reject {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-reject:hover { background-color: #dc2626; }
        .btn-ai-auto {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            margin-left: 10px;
        }
        .btn-ai-auto:hover { opacity: 0.92; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge.pending { background: #fef3c7; color: #b45309; }
        .badge.accepted { background: #dcfce7; color: #15803d; }
        .badge.rejected { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- HEADER -->
        <header>
            <h1>🥛 Fresh Milk BMC Dashboard</h1>
            <div class="stats">
                <a href="/vendor" target="_blank" style="margin-right: 15px; color: #2563eb; font-weight: bold;">🔗 Open Vendor Portal</a>
                <span id="lastUpdate">Last sync: --</span>
            </div>
        </header>

        <!-- INVENTORY -->
        <section class="inventory">
            <h2>📦 Current Inventory</h2>
            <div class="milk-cards">
                <div class="milk-card urgent">
                    <h3>30L</h3>
                    <span>0 days spoilage</span>
                </div>
                <div class="milk-card warning">
                    <h3 id="milk1day">10L</h3>
                    <span>1 day spoilage</span>
                </div>
                <div class="milk-card normal">
                    <h3 id="milk2days">5L</h3>
                    <span>2 days spoilage</span>
                </div>
            </div>
        </section>

        <!-- VENDORS LIST (Manual Controls + One-Click AI Auto-Handler) -->
        <section class="vendors">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 12px;">
                <h2 style="margin: 0;">🛒 Registered Vendor Orders</h2>
                <div>
                    <button onclick="refreshData()">🔄 Refresh</button>
                    <button class="btn-ai-auto" onclick="handleOrdersByAI()">🤖 Handle Orders by AI</button>
                </div>
            </div>

            <!-- AI Auto-Allocation Summary Banner -->
            <div id="aiAutoSummary" style="display: none; background: #eff6ff; border-left: 4px solid #2563eb; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;"></div>

            <div id="vendorsList">Refreshing...</div>
        </section>

        <!-- AI CHAT ADVISOR -->
        <section class="ai-chat">
            <h2>💬 Ask AI Advisor</h2>
            <div id="aiResponse" class="ai-output"></div>
            <div class="chat-input">
                <input type="text" id="aiQuery" placeholder="Ask AI: Which vendor should I pick?">
                <button onclick="askAI()">Ask AI</button>
            </div>
        </section>

        <!-- TRIGGER DISRUPTION (Hackathon Demo) -->
        <section class="demo">
            <button class="disrupt-btn" onclick="triggerDisruption()">🚨 Simulate Yield Drop</button>
        </section>
    </div>
    <script src="/static/js/dashboard.js?v=3"></script>
</body>
</html>
